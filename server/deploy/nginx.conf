# Example Nginx reverse proxy configuration with WebSocket support
server {
    listen 80;
    server_name park.andfriendslabs.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name park.andfriendslabs.com;

    # SSL certificates (e.g. Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/park.andfriendslabs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/park.andfriendslabs.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
